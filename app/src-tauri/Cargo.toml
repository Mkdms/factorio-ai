[package]
name = "factorio-pilot-app"
version = "0.1.0"
description = "Factorio Pilot 桌面界面 (三栏: 全队 / 对话 / 游戏读数), 连本机控制接口 npm run play:control"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
